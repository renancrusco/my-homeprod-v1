---
- resources:
    label: "🖥️ Kremlin Status"
    cpu: true
    memory: true
    disk: /
    uptime: true

- search:
    provider: brave
    target: _blank

- openmeteo:
    label: Indaiatuba # optional
    latitude: -23.0884
    longitude: -47.2119
    units: metric # or imperial
    cache: 5 # Time in minutes to cache API responses, to stay within limits
    format: # optional, Intl.NumberFormat options
      maximumFractionDigits: 1